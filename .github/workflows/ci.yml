name: FilePilot CI

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      real_documents:
        description: Run real LibreOffice acceptance on a disposable runner
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: filepilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Windows build, tests, package and deployment
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Release build, automated tests and validated package
        shell: pwsh
        run: |
          $package = & ./scripts/Build-Package.ps1 -OutputDirectory artifacts/ci-package -TestResultsDirectory artifacts/test-results
          if ($package.SourceDirty) { throw 'CI package must come from a clean source checkout.' }
      - name: Installer and upgrade/uninstall checks
        shell: pwsh
        run: |
          & ./scripts/Test-InstallTools.ps1 -PackagePath artifacts/ci-package/FilePilot-win-x64.zip
          & ./scripts/Test-DeploymentTools.ps1 -PackagePath artifacts/ci-package/FilePilot-win-x64.zip
      - name: Repeat WPF lifecycle and memory diagnostics in fresh test processes
        shell: pwsh
        run: ./scripts/Test-WpfReliability.ps1 -TestResultsDirectory artifacts/wpf-results -IncludeMemoryDiagnostics
      - name: Extracted package startup, memory and native compatibility smoke
        shell: pwsh
        run: ./scripts/Test-ExtractedPackage.ps1 -Path artifacts/ci-package/FilePilot-win-x64.zip -Runs 1
      - name: Retain test reports and candidate package (not a release)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilePilot-win-x64-${{ github.sha }}
          path: |
            artifacts/test-results/*.trx
            artifacts/wpf-results/*.trx
            artifacts/performance/*/*.json
            artifacts/ci-package/FilePilot-win-x64.zip
            artifacts/ci-package/FilePilot-win-x64.zip.sha256
          if-no-files-found: warn
          retention-days: 7

  documents:
    name: Real LibreOffice acceptance
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.real_documents) ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/feature/phase-7-beta-ci' ||
         github.ref == 'refs/heads/codex/phase-8-stabilization' ||
         github.ref == 'refs/heads/codex/phase-9-release-readiness' ||
         github.ref == 'refs/heads/codex/phase-10-beta-distribution' ||
         github.ref == 'refs/heads/codex/phase-11-beta-acceptance' ||
         github.ref == 'refs/heads/codex/phase-11-windows11-cloud' ||
         github.ref == 'refs/heads/codex/phase-11-explorer-ui-cloud'))
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install verified engine on disposable CI runner only
        shell: pwsh
        run: ./scripts/Install-CiDocumentEngine.ps1
      - name: Run all tests with the real renderer
        shell: pwsh
        run: |
          $env:FILEPILOT_LIBREOFFICE = Join-Path $env:ProgramFiles 'LibreOffice/program/soffice.com'
          $env:FILEPILOT_DOCUMENT_TEST_OUTPUT = Join-Path $PWD 'artifacts/document-acceptance/ci'
          New-Item -ItemType Directory -Force $env:FILEPILOT_DOCUMENT_TEST_OUTPUT | Out-Null
          dotnet test FilePilot.slnx -c Release --logger 'trx;LogFileName=Documents.trx' --results-directory artifacts/document-results --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw 'Real-engine acceptance failed.' }
      - name: Repeat WPF lifecycle and memory diagnostics after real-engine acceptance
        shell: pwsh
        run: ./scripts/Test-WpfReliability.ps1 -TestResultsDirectory artifacts/wpf-results -IncludeMemoryDiagnostics
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Independent PDF inspection and page rendering
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r scripts/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'PDF inspection tools could not be installed.' }
          python scripts/Inspect-DocumentPdf.py artifacts/document-acceptance/ci
          if ($LASTEXITCODE -ne 0) { throw 'Independent PDF acceptance failed.' }
      - name: Retain real-renderer test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilePilot-document-tests-${{ github.sha }}
          path: |
            artifacts/document-results/*.trx
            artifacts/wpf-results/*.trx
            artifacts/document-acceptance/ci/pdf-inspection.json
            artifacts/document-acceptance/ci/**/page-*.png
          if-no-files-found: warn
          retention-days: 7

  cloud_stability:
    name: Hosted 30-minute ${{ matrix.mode }} stability
    needs: build
    if: github.ref == 'refs/heads/codex/phase-11-beta-acceptance'
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [popup, widget]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish matching diagnostic executable
        id: publish
        shell: pwsh
        run: |
          dotnet publish src/FilePilot.App -c Release -r win-x64 --self-contained false -o artifacts/cloud-publish
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic publish failed.' }
      - name: Short extended control with the same cycle counts and budgets
        shell: pwsh
        env:
          FILEPILOT_DIAGNOSTIC_MODE: ${{ matrix.mode }}
        run: ./scripts/Measure-FilePilot.ps1 -ExecutablePath artifacts/cloud-publish/FilePilot.exe -Runs 1 -Mode $env:FILEPILOT_DIAGNOSTIC_MODE -Extended -IdleSeconds 30
      - name: Preserve existing performance limits through the full idle and cycle workload
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        shell: pwsh
        env:
          FILEPILOT_DIAGNOSTIC_MODE: ${{ matrix.mode }}
        run: ./scripts/Measure-FilePilot.ps1 -ExecutablePath artifacts/cloud-publish/FilePilot.exe -Runs 1 -Mode $env:FILEPILOT_DIAGNOSTIC_MODE -Extended -IdleSeconds 1800
      - name: Retain all measurement evidence including failed budgets
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilePilot-cloud-${{ matrix.mode }}-${{ github.sha }}
          path: artifacts/performance/*/*.json
          if-no-files-found: error
          retention-days: 7

  cloud_shell:
    name: Hosted native Shell menu acceptance
    needs: build
    if: github.ref == 'refs/heads/codex/phase-11-beta-acceptance'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish matching app under a Unicode and spaced path
        shell: pwsh
        run: |
          dotnet publish src/FilePilot.App -c Release -r win-x64 --self-contained false -o 'artifacts/cloud shell 文 publish'
          if ($LASTEXITCODE -ne 0) { throw 'Shell probe publish failed.' }
      - name: Enumerate the native classic menu on this disposable hosted VM
        shell: pwsh
        run: |
          pwsh -NoProfile -STA -File scripts/Test-HostedShellMenu.ps1 -ExecutablePath 'artifacts/cloud shell 文 publish/FilePilot.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Native Shell menu acceptance failed.' }
      - name: Retain native menu evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilePilot-cloud-shell-${{ github.sha }}
          path: artifacts/shell-acceptance/**/*.json
          if-no-files-found: warn
          retention-days: 7

  windows11_cloud:
    name: Windows 11 x64 emulation (${{ matrix.case }})
    needs: build
    if: github.ref == 'refs/heads/codex/phase-11-windows11-cloud'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        case: [shell, widget-current, widget-original]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 842847154b0357e0e6abae5220f6bb593b09fe32
          path: original
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          architecture: arm64
      - name: Publish the x64 executable for the declared application source
        shell: pwsh
        env:
          FILEPILOT_CASE: ${{ matrix.case }}
        run: |
          $source = if ($env:FILEPILOT_CASE -eq 'widget-original') { 'original' } else { 'candidate' }
          $actual = (git -C $source rev-parse HEAD).Trim()
          $expected = if ($source -eq 'original') { '842847154b0357e0e6abae5220f6bb593b09fe32' } else { $env:GITHUB_SHA }
          if ($actual -cne $expected -or @(git -C $source status --porcelain).Count) { throw 'Unexpected application source checkout.' }
          dotnet publish "$source/src/FilePilot.App" -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o 'candidate/artifacts/Windows 11 文 x64'
          if ($LASTEXITCODE -ne 0) { throw 'x64 test publication failed.' }
          $provenance = [ordered]@{ WorkflowSource = $env:GITHUB_SHA; ApplicationSource = $actual; HostArchitecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString(); Target = 'win-x64'; SelfContainedTestOnly = $true; ManualVerification = $false }
          $provenance | ConvertTo-Json | Write-Host
          [IO.File]::WriteAllText((Join-Path $PWD 'candidate/artifacts/windows11-provenance.json'), ($provenance | ConvertTo-Json))
      - name: Warm-cache native Shell acceptance on Windows 11
        if: matrix.case == 'shell'
        shell: pwsh
        run: |
          pwsh -NoProfile -STA -File candidate/scripts/Test-HostedShellMenu.ps1 -ExecutablePath 'candidate/artifacts/Windows 11 文 x64/FilePilot.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Windows 11 native Shell acceptance failed.' }
      - name: Resident 30-minute workload with unchanged X64 assertion and limits
        if: matrix.case != 'shell'
        shell: pwsh
        run: ./candidate/scripts/Measure-FilePilot.ps1 -ExecutablePath 'candidate/artifacts/Windows 11 文 x64/FilePilot.exe' -Runs 1 -Mode widget -Extended -IdleSeconds 1800
      - name: Retain Windows 11 diagnostic evidence, never the test binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilePilot-Windows11-${{ matrix.case }}-${{ github.sha }}
          path: |
            candidate/artifacts/windows11-provenance.json
            candidate/artifacts/shell-acceptance/**/*.json
            candidate/artifacts/performance/*/*.json
          if-no-files-found: error
          retention-days: 7

  explorer_ui_cloud:
    name: Automated Windows 11 Explorer launch and Copy Path
    needs: build
    if: github.ref == 'refs/heads/codex/phase-11-explorer-ui-cloud'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: candidate
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
          architecture: arm64
      - name: Publish the unchanged x64 app for this cloud-only UI test
        shell: pwsh
        run: |
          dotnet publish candidate/src/FilePilot.App -c Release -r win-x64 --self-contained true -p:DebugType=None -p:DebugSymbols=false -o 'candidate/artifacts/Explorer 文 x64'
          if ($LASTEXITCODE -ne 0) { throw 'x64 publication failed.' }
      - name: Warm the actual Explorer menu, register, launch and copy the exact path
        shell: pwsh
        run: |
          $app = (Resolve-Path -LiteralPath 'candidate/artifacts/Explorer 文 x64/FilePilot.exe').Path
          $output = Join-Path $env:GITHUB_WORKSPACE 'candidate/artifacts/explorer-ui'
          dotnet run --project candidate/tools/FilePilot.HostedExplorerProbe -c Release -- $app $output
          if ($LASTEXITCODE -ne 0) { throw 'Automated Explorer acceptance was not verified; inspect the stage/report.' }
      - name: Retain automated interaction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FilePilot-explorer-ui-${{ github.sha }}
          path: candidate/artifacts/explorer-ui/**/*.json
          if-no-files-found: warn
          retention-days: 7
